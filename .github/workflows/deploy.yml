name: Deploy por SSH

# Publica a web no servidor con rsync sobre SSH en cada push a main.
#
# Secrets necesarios (Settings → Secrets and variables → Actions):
#   SSH_HOST         servidor (p. ex. tortizorza.gal)
#   SSH_USER         usuario SSH
#   SSH_PRIVATE_KEY  chave privada sen frase de paso; a pública vai no
#                    ~/.ssh/authorized_keys do servidor
#   DEPLOY_PATH      directorio da web no servidor (p. ex. /var/www/tortizorza.gal)
# Opcionais:
#   SSH_PORT         porto SSH (por defecto 22)
#   SSH_KNOWN_HOSTS  saída de `ssh-keyscan -p PORTO HOST`; se falta, faise
#                    ssh-keyscan no momento (menos seguro)
#
# DEPLOY_PATH é exclusivo desta web: rsync --delete borra alí o que non
# estea en _site, agás os ficheiros ocultos da raíz (.htaccess, .well-known…).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar ficheiros públicos
        run: |
          mkdir _site
          cp -r index.html css images js files v[0-9]* _site/

      - name: Configurar SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::SSH_KNOWN_HOSTS sen definir; usando ssh-keyscan"
            ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" > ~/.ssh/known_hosts
          fi

      - name: Publicar con rsync
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          case "$DEPLOY_PATH" in
            ""|"/"|"~"|"."|"~/") echo "::error::DEPLOY_PATH baleiro ou perigoso"; exit 1 ;;
          esac
          # P /.*: non borrar ficheiros ocultos da raíz que xestiona o
          # hosting (.htaccess, .well-known/ para os certificados…).
          rsync -rlvz --delete --checksum --filter='P /.*' \
            -e "ssh -i ~/.ssh/id_deploy -p ${SSH_PORT:-22} -o StrictHostKeyChecking=yes" \
            _site/ "$SSH_USER@$SSH_HOST:${DEPLOY_PATH%/}/"
